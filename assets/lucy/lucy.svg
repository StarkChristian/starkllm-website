<svg class="lucy" data-state="idle" xmlns="http://www.w3.org/2000/svg" viewBox="90 -50 1080 1050" role="img" aria-labelledby="lucy-title">
  <title id="lucy-title">Lucy, the StarkLLM robot</title>
  <style>
/* Lucy, the StarkLLM robot. States: idle, wave, walk, point, talk, celebrate.
   Set them with data-state on the .lucy svg. Static poses for screenshots: data-pose. */

.lucy { display: block; width: 100%; height: auto; overflow: visible; }
.lucy * { transform-box: fill-box; }
.lucy-figure { transform-origin: 50% 100%; }
.lucy-head-g { transform-origin: 50% 100%; }
.lucy-arm-l { transform-origin: 100% 50%; }
.lucy-arm-r { transform-origin: 0% 50%; }
.lucy-leg { transform-origin: 50% 0%; }
.lucy-hair { transform-origin: 50% 100%; }
.lucy-eye { transform-origin: 50% 50%; }
.lucy-eyes { transform-origin: 50% 50%; }
.lucy-mouth { transform-origin: 50% 0%; }
.lucy-shadow { transform-origin: 50% 50%; }
.lucy-shoe { transform-origin: 50% 100%; }
.lucy-shoe-l { transform: rotate(-7deg); }
.lucy-shoe-r { transform: rotate(7deg); }

@keyframes lucy-bob      { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes lucy-step     { 0%, 100% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-9px) rotate(1.2deg); } }
@keyframes lucy-jump     { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-40px); } 60% { transform: translateY(-40px); } }
@keyframes lucy-blink    { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(0.07); } }
@keyframes lucy-look     { 0%, 14%, 100% { transform: translate(0, 0); } 22%, 40% { transform: translate(14px, -2px); } 52%, 66% { transform: translate(-14px, 2px); } 78% { transform: translate(0, 0); } }
@keyframes lucy-hair-sway{ 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
@keyframes lucy-wave-r   { 0%, 100% { transform: translateX(20px) rotate(-62deg); } 50% { transform: translateX(20px) rotate(-34deg); } }
@keyframes lucy-swing    { 0%, 100% { transform: rotate(14deg); } 50% { transform: rotate(-14deg); } }
@keyframes lucy-leg-swing{ 0%, 100% { transform: translateY(0) rotate(8deg); } 50% { transform: translateY(-16px) rotate(-8deg); } }
@keyframes lucy-arm-idle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
@keyframes lucy-talk     { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.35) translateY(4px); } }
@keyframes lucy-gesture  { 0%, 100% { transform: translateX(12px) rotate(-14deg); } 50% { transform: translateX(12px) rotate(-40deg); } }
@keyframes lucy-cheer-l  { 0%, 100% { transform: translateX(-20px) rotate(66deg); } 50% { transform: translateX(-20px) rotate(42deg); } }
@keyframes lucy-cheer-r  { 0%, 100% { transform: translateX(20px) rotate(-66deg); } 50% { transform: translateX(20px) rotate(-42deg); } }
@keyframes lucy-shadow-b { 0%, 100% { transform: scaleX(1); opacity: 0.28; } 50% { transform: scaleX(0.94); opacity: 0.22; } }

/* Idle is the default: breathing, blinking, looking around, hair swaying */
.lucy .lucy-figure   { animation: lucy-bob 3.2s ease-in-out infinite; }
.lucy .lucy-eye      { animation: lucy-blink 4.6s ease-in-out infinite; }
.lucy .lucy-eyes     { animation: lucy-look 9s ease-in-out infinite; }
.lucy .lucy-hair-1   { animation: lucy-hair-sway 3.6s ease-in-out infinite; }
.lucy .lucy-hair-2   { animation: lucy-hair-sway 3.1s ease-in-out -0.8s infinite; }
.lucy .lucy-hair-3   { animation: lucy-hair-sway 4.0s ease-in-out -1.6s infinite; }
.lucy .lucy-arm      { animation: lucy-arm-idle 3.2s ease-in-out infinite; }
.lucy .lucy-shadow   { animation: lucy-shadow-b 3.2s ease-in-out infinite; }

/* Wave hello with the right arm */
.lucy[data-state="wave"] .lucy-arm-r { animation: lucy-wave-r 0.7s ease-in-out infinite; }

/* Walk: legs and arms swing in opposite phase, body bounces */
.lucy[data-state="walk"] .lucy-figure { animation: lucy-step 0.6s ease-in-out infinite; }
.lucy[data-state="walk"] .lucy-leg-l  { animation: lucy-leg-swing 1.2s ease-in-out infinite; }
.lucy[data-state="walk"] .lucy-leg-r  { animation: lucy-leg-swing 1.2s ease-in-out -0.6s infinite; }
.lucy[data-state="walk"] .lucy-arm-l  { animation: lucy-swing 1.2s ease-in-out infinite; }
.lucy[data-state="walk"] .lucy-arm-r  { animation: lucy-swing 1.2s ease-in-out infinite; }
.lucy[data-state="walk"] .lucy-hair   { animation-duration: 1.2s; }

/* Point at something on the left while explaining */
.lucy[data-state="point"] .lucy-arm-l { animation: none; transform: translateX(-20px) rotate(48deg); }
.lucy[data-state="point"] .lucy-mouth { animation: lucy-talk 0.45s ease-in-out infinite; }

/* Talk: mouth moves and the right hand gestures */
.lucy[data-state="talk"] .lucy-mouth { animation: lucy-talk 0.45s ease-in-out infinite; }
.lucy[data-state="talk"] .lucy-arm-r { animation: lucy-gesture 1.1s ease-in-out infinite; }

/* Celebrate: both arms up, little jumps */
.lucy[data-state="celebrate"] .lucy-figure { animation: lucy-jump 0.9s ease-in-out infinite; }
.lucy[data-state="celebrate"] .lucy-arm-l  { animation: lucy-cheer-l 0.45s ease-in-out infinite; }
.lucy[data-state="celebrate"] .lucy-arm-r  { animation: lucy-cheer-r 0.45s ease-in-out infinite; }

/* Static poses for PNG export and for reduced motion */
.lucy[data-pose] *, .lucy[data-pose] { animation: none !important; }
.lucy[data-pose="blink"] .lucy-eye   { transform: scaleY(0.07); }
.lucy[data-pose="wave"] .lucy-arm-r  { transform: translateX(20px) rotate(-50deg); }
.lucy[data-pose="point"] .lucy-arm-l { transform: translateX(-20px) rotate(48deg); }
.lucy[data-pose="walk-a"] .lucy-leg-l { transform: translateY(0) rotate(8deg); }
.lucy[data-pose="walk-a"] .lucy-leg-r { transform: translateY(-16px) rotate(-8deg); }
.lucy[data-pose="walk-a"] .lucy-arm-l { transform: rotate(14deg); }
.lucy[data-pose="walk-a"] .lucy-arm-r { transform: rotate(14deg); }
.lucy[data-pose="walk-b"] .lucy-leg-l { transform: translateY(-16px) rotate(-8deg); }
.lucy[data-pose="walk-b"] .lucy-leg-r { transform: translateY(0) rotate(8deg); }
.lucy[data-pose="walk-b"] .lucy-arm-l { transform: rotate(-14deg); }
.lucy[data-pose="walk-b"] .lucy-arm-r { transform: rotate(-14deg); }
.lucy[data-pose="celebrate"] .lucy-arm-l { transform: translateX(-20px) rotate(62deg); }
.lucy[data-pose="celebrate"] .lucy-arm-r { transform: translateX(20px) rotate(-62deg); }
.lucy[data-pose="celebrate"] .lucy-figure { transform: translateY(-30px); }
.lucy[data-pose="talk"] .lucy-arm-r  { transform: translateX(12px) rotate(-26deg); }
.lucy[data-pose="talk"] .lucy-mouth  { transform: scaleY(1.3) translateY(4px); }

@media (prefers-reduced-motion: reduce) {
  .lucy *, .lucy { animation: none !important; }
}

</style>
  <defs>
    <linearGradient id="lucy-body-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4390d0"/>
      <stop offset="0.55" stop-color="#3a84c4"/>
      <stop offset="1" stop-color="#3178b6"/>
    </linearGradient>
    <linearGradient id="lucy-limb-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8ccc"/>
      <stop offset="1" stop-color="#2f74b0"/>
    </linearGradient>
    <linearGradient id="lucy-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lucy-eye-fill" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#3b3531"/>
      <stop offset="1" stop-color="#1d1917"/>
    </radialGradient>
    <filter id="lucy-soft" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <ellipse class="lucy-shadow" cx="640" cy="954" rx="350" ry="30" fill="#0b1b2b" opacity="0.28" filter="url(#lucy-soft)"/>

  <g class="lucy-figure">
    <g class="lucy-leg lucy-leg-l">
      <rect x="502" y="780" width="70" height="130" rx="26" fill="url(#lucy-limb-fill)"/>
      <g class="lucy-shoe lucy-shoe-l">
        <rect x="486" y="890" width="102" height="50" rx="22" fill="#e2492c"/>
        <rect x="482" y="918" width="110" height="30" rx="15" fill="#f6c313"/>
        <rect x="476" y="942" width="122" height="16" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="2"/>
        <path d="M517 904h40M515 912h44M517 920h40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>
    </g>
    <g class="lucy-leg lucy-leg-r">
      <rect x="685" y="780" width="72" height="130" rx="26" fill="url(#lucy-limb-fill)"/>
      <g class="lucy-shoe lucy-shoe-r">
        <rect x="670" y="890" width="102" height="50" rx="22" fill="#e2492c"/>
        <rect x="666" y="918" width="110" height="30" rx="15" fill="#f6c313"/>
        <rect x="660" y="942" width="122" height="16" rx="8" fill="#ffffff" stroke="#cfd6de" stroke-width="2"/>
        <path d="M701 904h40M699 912h44M701 920h40" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
      </g>
    </g>

    <g class="lucy-arm lucy-arm-l"><rect x="108" y="532" width="174" height="66" rx="28" fill="url(#lucy-limb-fill)"/></g>
    <g class="lucy-arm lucy-arm-r"><rect x="986" y="532" width="164" height="68" rx="28" fill="url(#lucy-limb-fill)"/></g>

    <g class="lucy-head-g">
      <path class="lucy-hair lucy-hair-1" d="M508 262 C 508 170 486 110 448 62" fill="none" stroke="#f6b800" stroke-width="10" stroke-linecap="round"/>
      <path class="lucy-hair lucy-hair-2" d="M633 262 C 633 170 640 90 660 30" fill="none" stroke="#f6b800" stroke-width="10" stroke-linecap="round"/>
      <path class="lucy-hair lucy-hair-3" d="M757 262 C 757 190 770 130 808 80" fill="none" stroke="#f6b800" stroke-width="10" stroke-linecap="round"/>

      <rect class="lucy-body" x="262" y="258" width="744" height="548" rx="52" fill="url(#lucy-body-fill)"/>
      <rect x="262" y="258" width="744" height="548" rx="52" fill="url(#lucy-shine)"/>

      <g class="lucy-eyes">
        <circle cx="467" cy="481" r="75" fill="#1c4a78" opacity="0.28"/>
        <circle cx="798" cy="481" r="75" fill="#1c4a78" opacity="0.28"/>
        <ellipse class="lucy-eye" cx="467" cy="478" rx="68" ry="68" fill="url(#lucy-eye-fill)"/>
        <ellipse class="lucy-eye" cx="798" cy="478" rx="68" ry="68" fill="url(#lucy-eye-fill)"/>
      </g>
      <path class="lucy-mouth" d="M551 628 C 575 690 690 692 716 622" fill="none" stroke="#d6363d" stroke-width="30" stroke-linecap="round"/>
    </g>
  </g>
</svg>
