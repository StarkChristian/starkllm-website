<main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem;">
        <div class="content-block" style="text-align: center; max-width: 640px; margin: 0 auto; padding: 3rem 2rem;">
            <p style="font-size: 5rem; font-weight: 800; line-height: 1; margin-bottom: 1rem;" class="text-gradient">404</p>
            <h1 style="font-size: 2rem; margin-bottom: 1rem;">Page Not Found</h1>
            <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 1.1rem;">
                The page you are looking for doesn't exist, has been moved, or the link may be outdated.
            </p>
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                <a href="/" class="btn btn-primary" style="padding: 0.8rem 1.6rem; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;">Return Home</a>
                <a href="/product" class="btn btn-secondary" style="padding: 0.8rem 1.6rem; border-radius: 8px; border: 1px solid var(--border); color: var(--text-primary); text-decoration: none;">View Product</a>
                <a href="/download" class="btn btn-secondary" style="padding: 0.8rem 1.6rem; border-radius: 8px; border: 1px solid var(--border); color: var(--text-primary); text-decoration: none;">Download</a>
                <a href="/manual" class="btn btn-secondary" style="padding: 0.8rem 1.6rem; border-radius: 8px; border: 1px solid var(--border); color: var(--text-primary); text-decoration: none;">User Manual</a>
            </div>
        </div>
    </main>
